[package]
name = "mlrescurix-harness"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
rusqlite = { version = "=0.37.0", features = ["bundled"] }
tokio = { version = "=1.48.0", features = ["rt", "macros"] }
tracing = "=0.1.41"
clap = { version = "=4.5.50", features = ["derive"] }
sha2 = "=0.10.9"
libc = "=0.2.190"

tempfile = "=3.23.0"
