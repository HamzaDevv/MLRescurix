[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mlrescurix-worker-protocol"
version = "0.1.0"
description = "MLRescurix M0 protocol contracts; no scientific execution"
requires-python = ">=3.13,<3.14"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mlrescurix_worker.protocol" = ["*.json"]
